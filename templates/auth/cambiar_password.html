{% extends "base.html" %}

{% block title %}Cambiar Contraseña - Biblioteca{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <img class="mx-auto h-20 w-auto" src="{{ url_for('static', filename='img/LogoPSM.png') }}" alt="Logo">
        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
            Cambiar Contraseña
        </h2>
        <p class="mt-2 text-center text-sm text-gray-600">
            Actualiza tu contraseña de acceso
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
            <form id="cambiar-password-form" class="space-y-6">
                <div>
                    <label for="password_actual" class="block text-sm font-medium text-gray-700">
                        Contraseña Actual *
                    </label>
                    <div class="mt-1 relative">
                        <input id="password_actual" name="password_actual" type="password" required
                               class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        <button type="button" onclick="togglePassword('password_actual')" 
                                class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <i data-lucide="eye" class="h-5 w-5 text-gray-400"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="nueva_password" class="block text-sm font-medium text-gray-700">
                        Nueva Contraseña *
                    </label>
                    <div class="mt-1 relative">
                        <input id="nueva_password" name="nueva_password" type="password" required
                               class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        <button type="button" onclick="togglePassword('nueva_password')" 
                                class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <i data-lucide="eye" class="h-5 w-5 text-gray-400"></i>
                        </button>
                    </div>
                    <p class="mt-2 text-sm text-gray-500">
                        Mínimo 8 caracteres. Se recomienda usar mayúsculas, minúsculas, números y símbolos.
                    </p>
                </div>

                <div>
                    <label for="confirmar_password" class="block text-sm font-medium text-gray-700">
                        Confirmar Nueva Contraseña *
                    </label>
                    <div class="mt-1 relative">
                        <input id="confirmar_password" name="confirmar_password" type="password" required
                               class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        <button type="button" onclick="togglePassword('confirmar_password')" 
                                class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <i data-lucide="eye" class="h-5 w-5 text-gray-400"></i>
                        </button>
                    </div>
                    <div id="password-match" class="mt-1 hidden text-sm"></div>
                </div>

                <div>
                    <button type="submit" id="btn-cambiar"
                            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Cambiar Contraseña
                    </button>
                </div>

                <div class="text-center">
                    <a href="{{ url_for('perfil') }}" class="font-medium text-blue-600 hover:text-blue-500">
                        ← Volver al Perfil
                    </a>
                </div>
            </form>
            
            <div id="message" class="mt-4 hidden p-4 rounded-md"></div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const icon = input.nextElementSibling.querySelector('i');
    
    if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
    } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
    }
    lucide.createIcons();
}

document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('cambiar-password-form');
    const btnCambiar = document.getElementById('btn-cambiar');
    const messageDiv = document.getElementById('message');
    const nuevaPasswordInput = document.getElementById('nueva_password');
    const confirmarPasswordInput = document.getElementById('confirmar_password');
    const matchDiv = document.getElementById('password-match');
    
    // Validar coincidencia de contraseñas
    confirmarPasswordInput.addEventListener('input', function() {
        const nuevaPassword = nuevaPasswordInput.value;
        const confirmar = this.value;
        
        if (confirmar) {
            matchDiv.classList.remove('hidden');
            if (nuevaPassword === confirmar) {
                matchDiv.textContent = '✓ Las contraseñas coinciden';
                matchDiv.className = 'mt-1 text-sm text-green-600';
            } else {
                matchDiv.textContent = '✗ Las contraseñas no coinciden';
                matchDiv.className = 'mt-1 text-sm text-red-600';
            }
        } else {
            matchDiv.classList.add('hidden');
        }
    });
    
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const passwordActual = document.getElementById('password_actual').value;
        const nuevaPassword = nuevaPasswordInput.value;
        const confirmarPassword = confirmarPasswordInput.value;
        
        if (!passwordActual || !nuevaPassword || !confirmarPassword) {
            showMessage('Por favor completa todos los campos', 'error');
            return;
        }
        
        if (nuevaPassword !== confirmarPassword) {
            showMessage('Las nuevas contraseñas no coinciden', 'error');
            return;
        }
        
        if (nuevaPassword.length < 8) {
            showMessage('La nueva contraseña debe tener al menos 8 caracteres', 'error');
            return;
        }
        
        // Mostrar loading
        btnCambiar.disabled = true;
        btnCambiar.innerHTML = '<i data-lucide="loader" class="h-5 w-5 animate-spin mr-2"></i> Cambiando...';
        
        try {
            const response = await fetch('/cambiar-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    password_actual: passwordActual,
                    nueva_password: nuevaPassword,
                    confirmar_password: confirmarPassword
                })
            });
            
            const result = await response.json();
            
            if (result.estado === 'ok') {
                showMessage(result.mensaje, 'success');
                form.reset();
                setTimeout(() => {
                    window.location.href = '/perfil';
                }, 2000);
            } else {
                showMessage(result.mensaje, 'error');
                btnCambiar.disabled = false;
                btnCambiar.innerHTML = 'Cambiar Contraseña';
            }
            
        } catch (error) {
            console.error('Error cambiando contraseña:', error);
            showMessage('Error de conexión. Intenta nuevamente.', 'error');
            btnCambiar.disabled = false;
            btnCambiar.innerHTML = 'Cambiar Contraseña';
        }
    });
    
    function showMessage(message, type) {
        messageDiv.textContent = message;
        messageDiv.className = `p-4 rounded-md ${type === 'error' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
        messageDiv.classList.remove('hidden');
        
        setTimeout(() => {
            messageDiv.classList.add('hidden');
        }, 5000);
    }
    
    // Inicializar íconos
    lucide.createIcons();
});
</script>
{% endblock %}
