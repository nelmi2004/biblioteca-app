{% extends "base_auth.html" %}

{% block title %}Restablecer Contraseña - Biblioteca{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <img class="mx-auto h-24 w-auto" src="{{ url_for('static', filename='img/LogoPSM.png') }}" alt="Logo">
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                Nueva Contraseña
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Crea una nueva contraseña para tu cuenta
            </p>
        </div>
        
        <form id="reset-password-form" class="mt-8 space-y-6">
            <input type="hidden" id="token" value="{{ token }}">
            
            <div>
                <label for="nueva_password" class="block text-sm font-medium text-gray-700 mb-1">
                    Nueva Contraseña *
                </label>
                <div class="relative">
                    <input id="nueva_password" name="nueva_password" type="password" required
                           class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                           placeholder="Mínimo 8 caracteres">
                    <button type="button" onclick="togglePassword('nueva_password')" 
                            class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <i data-lucide="eye" class="h-5 w-5 text-gray-400"></i>
                    </button>
                </div>
                <p class="mt-1 text-xs text-gray-500">
                    Usa una combinación de letras, números y símbolos
                </p>
            </div>
            
            <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">
                    Confirmar Contraseña *
                </label>
                <div class="relative">
                    <input id="confirm_password" name="confirm_password" type="password" required
                           class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                           placeholder="Repite tu contraseña">
                    <button type="button" onclick="togglePassword('confirm_password')" 
                            class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <i data-lucide="eye" class="h-5 w-5 text-gray-400"></i>
                    </button>
                </div>
                <div id="password-match" class="mt-1 hidden text-xs"></div>
            </div>

            <div>
                <button type="submit" id="btn-reset"
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i data-lucide="lock" class="h-5 w-5 text-blue-500 group-hover:text-blue-400"></i>
                    </span>
                    Restablecer Contraseña
                </button>
            </div>
            
            <div class="text-center">
                <a href="{{ url_for('login') }}" class="font-medium text-blue-600 hover:text-blue-500">
                    ← Volver al Login
                </a>
            </div>
        </form>
        
        <div id="message" class="hidden p-4 rounded-md"></div>
    </div>
</div>

<script>
function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const icon = input.nextElementSibling.querySelector('i');
    
    if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
    } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
    }
    lucide.createIcons();
}

document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('reset-password-form');
    const btnReset = document.getElementById('btn-reset');
    const messageDiv = document.getElementById('message');
    const nuevaPasswordInput = document.getElementById('nueva_password');
    const confirmPasswordInput = document.getElementById('confirm_password');
    const matchDiv = document.getElementById('password-match');
    const token = document.getElementById('token').value;
    
    // Validar coincidencia de contraseñas
    confirmPasswordInput.addEventListener('input', function() {
        const nuevaPassword = nuevaPasswordInput.value;
        const confirmar = this.value;
        
        if (confirmar) {
            matchDiv.classList.remove('hidden');
            if (nuevaPassword === confirmar) {
                matchDiv.textContent = '✓ Las contraseñas coinciden';
                matchDiv.className = 'mt-1 text-xs text-green-600';
            } else {
                matchDiv.textContent = '✗ Las contraseñas no coinciden';
                matchDiv.className = 'mt-1 text-xs text-red-600';
            }
        } else {
            matchDiv.classList.add('hidden');
        }
    });
    
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const nuevaPassword = nuevaPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        
        if (!nuevaPassword || !confirmPassword) {
            showMessage('Por favor completa todos los campos', 'error');
            return;
        }
        
        if (nuevaPassword !== confirmPassword) {
            showMessage('Las contraseñas no coinciden', 'error');
            return;
        }
        
        if (nuevaPassword.length < 8) {
            showMessage('La contraseña debe tener al menos 8 caracteres', 'error');
            return;
        }
        
        // Mostrar loading
        btnReset.disabled = true;
        btnReset.innerHTML = '<i data-lucide="loader" class="h-5 w-5 animate-spin mr-2"></i> Procesando...';
        
        try {
            const response = await fetch(`/reset-password/${token}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    nueva_password: nuevaPassword,
                    confirm_password: confirmPassword
                })
            });
            
            const result = await response.json();
            
            if (result.estado === 'ok') {
                showMessage(result.mensaje, 'success');
                setTimeout(() => {
                    window.location.href = result.redirect || '/login';
                }, 2000);
            } else {
                showMessage(result.mensaje, 'error');
                btnReset.disabled = false;
                btnReset.innerHTML = 'Restablecer Contraseña';
            }
            
        } catch (error) {
            console.error('Error reseteando contraseña:', error);
            showMessage('Error de conexión. Intenta nuevamente.', 'error');
            btnReset.disabled = false;
            btnReset.innerHTML = 'Restablecer Contraseña';
        }
    });
    
    function showMessage(message, type) {
        messageDiv.textContent = message;
        messageDiv.className = `p-4 rounded-md ${type === 'error' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
        messageDiv.classList.remove('hidden');
        
        setTimeout(() => {
            messageDiv.classList.add('hidden');
        }, 5000);
    }
    
    // Inicializar íconos
    lucide.createIcons();
});
</script>
{% endblock %}
